name: Flutter CI

on:
  push:
    branches: [develop, main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java (untuk toolchain Android/Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 21, bukan 17: plugin `maplibre_gl` memakai source/target Java 21
          # sehingga build gagal dengan "error: invalid source release: 21".
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Dipin ke versi yang dipakai developer (3.41.7). Analyzer versi
          # stable terbaru memunculkan lint baru yang tidak ada di sini,
          # sehingga CI merah walau `flutter analyze` lokal bersih —
          # gate merge jadi tidak deterministik.
          flutter-version: 3.41.7
          cache: true

      - name: Info versi
        run: flutter --version

      - name: Ambil dependency
        run: flutter pub get

      # `.env` di-gitignore (tidak boleh masuk repo), padahal pubspec.yaml
      # mendaftarkannya sebagai asset. Tanpa file ini `flutter analyze` sudah
      # gagal: "warning • The asset file '.env' doesn't exist". Nilai di sini
      # placeholder — hanya untuk membuktikan proyek bisa dianalisis &
      # dikompilasi, bukan untuk build rilis.
      - name: Buat .env placeholder
        run: |
          if [ -f .env ]; then
            echo ".env sudah ada."
          else
            {
              echo "SUPABASE_URL=https://ci-placeholder.supabase.co"
              echo "SUPABASE_ANON_KEY=ci-placeholder-anon-key"
              echo "ONESIGNAL_APP_ID=ci-placeholder-onesignal"
              echo "MAPTILER_KEY=ci-placeholder-maptiler"
            } > .env
            echo "Placeholder .env dibuat."
          fi

      # `flutter analyze` mengembalikan exit code != 0 kalau ada error ATAU
      # warning. Infos (lint gaya) tidak menggagalkan build — jumlahnya ratusan
      # dan tidak relevan untuk gate merge.
      - name: Analyze (error & warning = gagal)
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          # Temuan dipancarkan sebagai annotation supaya kelihatan tanpa perlu
          # login (log CI repo publik cuma bisa dibuka kalau sudah masuk).
          # Format `flutter analyze`: "error • pesan • file:line • kode".
          findings=$(grep -E "(error|warning)[[:space:]]*[•-]" analyze.log | head -25)
          if [ -n "$findings" ]; then
            printf '%s\n' "$findings" | while IFS= read -r line; do echo "::error::$line"; done
          else
            # Tidak ada daftar temuan sama sekali → analyze gagal sebelum
            # analisis (error toolchain). Kirim ekor outputnya sebagai annotation.
            echo "::error::flutter analyze tidak menghasilkan daftar temuan (exit $status); 25 baris terakhir output:"
            tail -25 analyze.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          if [ "$status" -eq 0 ]; then
            echo "Analyze bersih: 0 error, 0 warning."
          else
            echo "::error::flutter analyze gagal (exit $status)."
          fi
          exit "$status"

      # Informasi saja: repo ini belum 100% `dart format`-clean, jadi jangan
      # menggagalkan merge. Jalankan `dart format lib test` lokal sebelum PR
      # besar kalau ingin diffnya rapi.
      - name: Format check (informasi, tidak memblokir)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Test
        run: flutter test --reporter expanded

      # Build debug APK membuktikan proyek benar-benar bisa dikompilasi
      # (analyze saja tidak menangkap error plugin Android).
      # Plugin `com.google.gms.google-services` diterapkan di
      # android/app/build.gradle.kts, tapi google-services.json di-gitignore
      # (berisi API key project Firebase). Tanpa file ini build Android gagal:
      # "File google-services.json is missing". Placeholder di bawah cukup
      # untuk kompilasi; build rilis tetap memakai file asli di mesin dev/CI
      # rahasia.
      - name: Buat google-services.json placeholder (kalau tidak ada)
        run: |
          f=android/app/google-services.json
          if [ -f "$f" ]; then
            echo "google-services.json sudah ada."
          else
            cat > "$f" <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.tenmu.mobile" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyCI_PLACEHOLDER_000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "Placeholder google-services.json dibuat."
          fi

      - name: Build APK debug
        run: |
          set +e
          flutter build apk --debug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::flutter build apk gagal (exit $status)"
            # Baris kunci Gradle lebih berguna daripada 30 baris terakhir mentah.
            grep -aE "FAILURE|What went wrong|Execution failed|Could not (resolve|find|determine)|error:|Caused by|OutOfMemory|heap space|SDK location|minSdk|A problem occurred" build.log \
              | head -20 \
              | while IFS= read -r line; do echo "::error::$line"; done
            echo "::error::--- 40 baris terakhir ---"
            tail -40 build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
          fi
          exit "$status"

  migrations-lint:
    name: Cek migrasi SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Semua file migrasi berakhiran .sql & nama unik
        run: |
          set -eu
          dir=supabase/migrations
          if [ ! -d "$dir" ]; then
            echo "Tidak ada folder $dir — dilewati."
            exit 0
          fi

          bad=0
          for f in "$dir"/*; do
            [ -e "$f" ] || continue
            case "$f" in
              *.sql) ;;
              *.md) ;;   # README/dokumentasi migrasi — diizinkan
              *) echo "::error file=$f::File di supabase/migrations harus .sql (atau .md untuk dokumentasi)"; bad=1 ;;
            esac
          done

          # Timestamp harus format YYYYMMDDHHMMSS_ (14 digit) atau YYYYMMDDHHMMSS.
          for f in "$dir"/*.sql; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_*) ;;
              *) echo "::error file=$f::Nama harus berawalan 14 digit timestamp + '_'"; bad=1 ;;
            esac
          done

          dup=$(ls "$dir"/*.sql | sed 's|.*/||' | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::Timestamp migrasi duplikat: $dup"
            bad=1
          fi

          exit $bad
